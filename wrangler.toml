name = "ecommerce-financial-saas-api"
main = "workers/src/index.js"
account_id = "b2a36cb6686be9ab24fd26e955241238"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ── Dedicated SaaS D1 Database ───────────────────────────────
[[d1_databases]]
binding  = "DB"
database_name = "ecommerce-financial-saas-db"
database_id   = "REPLACE_WITH_SAAS_D1_DATABASE_ID"

# ── Environment variables ──────────────────────────────────
[vars]
ENVIRONMENT                  = "production"
DEFAULT_CURRENCY             = "GBP"
SESSION_EXPIRY_HOURS         = "24"
CORS_ORIGIN                  = "*"

# ── Development overrides ──────────────────────────────────
[env.dev]
[env.dev.vars]
ENVIRONMENT  = "development"
CORS_ORIGIN  = "*"
