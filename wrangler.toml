name = "ecommerce-financial-saas-api"
main = "workers/src/index.js"
account_id = "8d1812ecf11ebb0d69789f2a784d533a"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ── Dedicated SaaS D1 Database ───────────────────────────────
[[d1_databases]]
binding  = "DB"
database_name = "ecommerce-financial-saas-db"
database_id   = "b8da9d2f-36ac-44fe-9549-6a3e921b2601"

# ── Environment variables ──────────────────────────────────
[vars]
ENVIRONMENT                  = "production"
DEFAULT_CURRENCY             = "GBP"
SESSION_EXPIRY_HOURS         = "24"
CORS_ORIGIN                  = "*"

# ── Development overrides ──────────────────────────────────
[env.dev]
[env.dev.vars]
ENVIRONMENT  = "development"
CORS_ORIGIN  = "*"
