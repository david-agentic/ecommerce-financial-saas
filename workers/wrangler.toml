name = "fin-saas-api"
main = "src/index.js"
account_id = "b2a36cb6686be9ab24fd26e955241238"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ── D1 Database ────────────────────────────────────────────
[[d1_databases]]
binding  = "DB"
database_name = "fin-saas-db"
database_id   = "REPLACE_WITH_SAAS_D1_DATABASE_ID"

# ── KV (rate limiting + token blacklists + short cache) ────
[[kv_namespaces]]
binding = "KV"
id      = "REPLACE_WITH_SAAS_KV_NAMESPACE_ID"

# ── Environment variables ──────────────────────────────────
[vars]
ENVIRONMENT                  = "production"
DEFAULT_CURRENCY             = "GBP"
SESSION_EXPIRY_HOURS         = "24"
CORS_ORIGIN                  = "*"

# ── Development overrides ──────────────────────────────────
[env.dev]
[env.dev.vars]
ENVIRONMENT  = "development"
CORS_ORIGIN  = "*"
